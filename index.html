<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de precios · Kiosco Brandsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo:#a41f22;
    --rojo-osc:#7d1618;
    --amarillo:#e2c21f;
    --negro:#1a1a1a;
    --papel:#faf6ec;
    --crema:#f0e8d4;
    --linea:#e2d8c0;
    --gris:#6f665a;
    --verde:#2f7d4f;
    --verde-suave:#e3f0e6;
    --violeta:#6b4a8a;
    --violeta-suave:#efe7f4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--papel);
    color:var(--negro);
    line-height:1.4;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

  header{
    position:sticky;top:0;z-index:10;
    background:var(--rojo);
    color:#fff;
    padding:16px 16px 16px;
    border-bottom:5px solid var(--amarillo);
  }
  .header-inner{max-width:760px;margin:0 auto}
  .marca{
    display:flex;align-items:center;justify-content:center;
  }
  .logo-img{
    display:block;
    width:auto;height:96px;max-width:100%;
  }
  .subtitulo{
    text-align:center;margin-top:2px;
    font-size:.82rem;font-weight:700;letter-spacing:.06em;
    color:var(--amarillo);text-transform:uppercase;
  }
  .buscador{
    margin-top:14px;position:relative;
  }
  .buscador input{
    width:100%;
    font-size:1.15rem;
    padding:15px 46px 15px 16px;
    border:none;border-radius:10px;
    background:#fff;color:var(--negro);
    outline:3px solid transparent;
    transition:outline-color .15s;
  }
  .buscador input:focus{outline-color:var(--amarillo)}
  .buscador .lupa{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:1.3rem;color:var(--gris);pointer-events:none;
  }
  .buscador .limpiar{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:var(--crema);border:none;border-radius:50%;
    width:28px;height:28px;font-size:1.1rem;color:var(--negro);
    cursor:pointer;display:none;line-height:1;
  }
  .buscador.tiene-texto .lupa{display:none}
  .buscador.tiene-texto .limpiar{display:block}

  .filtros{
    margin-top:10px;display:flex;gap:8px;
  }
  .chip{
    border:none;cursor:pointer;
    font-size:.82rem;font-weight:700;
    padding:7px 14px;border-radius:20px;
    letter-spacing:.02em;
    color:#fff;background:rgba(255,255,255,.18);
    transition:background .15s;
  }
  .chip:hover{background:rgba(255,255,255,.3)}
  .chip.activo.chip-st{background:var(--verde);color:#fff}
  .chip.activo.chip-vg{background:var(--violeta);color:#fff}

  .estado{
    text-align:center;color:var(--gris);
    padding:48px 20px;font-size:1rem;
  }
  .estado.error{color:var(--rojo);font-weight:600}

  .conteo{
    padding:16px 2px 6px;font-size:.8rem;color:var(--gris);
    text-transform:uppercase;letter-spacing:.03em;font-weight:600;
  }

  ul{list-style:none}
  .item{
    display:flex;align-items:center;gap:12px;
    padding:14px 4px;border-bottom:1px solid var(--linea);
  }
  .item .info{flex:1;min-width:0}
  .item .nombre{
    font-size:1.02rem;font-weight:600;
  }
  .item .cat{
    font-size:.72rem;color:var(--gris);margin-top:2px;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{
    font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:20px;
    letter-spacing:.02em;
  }
  .tag.st{background:var(--verde-suave);color:var(--verde)}
  .tag.vg{background:var(--violeta-suave);color:var(--violeta)}
  .precio{
    font-family:"Anton",sans-serif;
    font-size:1.5rem;white-space:nowrap;
    color:var(--rojo);letter-spacing:.01em;
  }
  .precio.sin{
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size:.8rem;font-weight:600;color:var(--gris);
  }

  mark{background:var(--amarillo);color:var(--negro);border-radius:2px;padding:0 1px}

  footer{
    text-align:center;padding:28px 16px;color:var(--gris);
    font-size:.76rem;line-height:1.6;
  }
  footer strong{color:var(--rojo);font-family:"Archivo Black",sans-serif;font-weight:normal}

  .wsp{
    position:fixed;right:16px;bottom:16px;z-index:20;
    display:flex;align-items:center;gap:8px;
    background:#25D366;color:#fff;
    text-decoration:none;
    padding:12px 18px;border-radius:30px;
    font-weight:700;font-size:.95rem;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transition:transform .15s, box-shadow .15s;
  }
  .wsp:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .wsp svg{flex-shrink:0}
  @media(max-width:480px){
    .wsp span{display:none}
    .wsp{padding:14px;border-radius:50%}
  }
  @media(max-width:480px){
    .titulos h1{font-size:1.15rem}
    .logo{width:46px;height:46px;font-size:1.15rem}
    .item .nombre{font-size:.96rem}
    .precio{font-size:1.3rem}
  }
</style>
</head>

      <path d="M16 .4C7.4.4.5 7.3.5 15.9c0 2.8.7 5.4 2 7.8L.4 31.6l8.1-2.1c2.3 1.3 4.9 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.4 16 .4zm0 28.4c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.8 1.3 1.3-4.7-.3-.5c-1.3-2.1-2-4.5-2-7 0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.8 12.9zm7.1-9.7c-.4-.2-2.3-1.1-2.6-1.3-.4-.1-.6-.2-.9.2s-1 1.3-1.2 1.5c-.2.2-.4.3-.8.1s-1.6-.6-3.1-1.9c-1.1-1-1.9-2.3-2.1-2.6-.2-.4 0-.6.2-.7.2-.2.4-.4.5-.7.2-.2.2-.4.4-.6.1-.3 0-.5 0-.7s-.9-2.1-1.2-2.9c-.3-.8-.6-.6-.9-.7h-.7c-.3 0-.7.1-1 .5s-1.3 1.3-1.3 3.1 1.3 3.6 1.5 3.8c.2.2 2.6 4 6.3 5.6.9.4 1.6.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2.3-.9 2.6-1.8.3-.9.3-1.7.2-1.8-.1-.2-.3-.3-.7-.5z"/>

<script>
// ====== CONFIGURACION ======
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJxg_tnPLtQ1Z1L7eTtvLppEhDqIkc85itp3bLklYWF18VlRbubEsggBtOh8YV82u9iLVbiM76hXgu/pub?gid=525225460&single=true&output=csv";
// ===========================

const estado = document.getElementById('estado');
const lista = document.getElementById('lista');
const conteo = document.getElementById('conteo');
const input = document.getElementById('q');
const caja = document.getElementById('cajaBuscador');
const btnLimpiar = document.getElementById('limpiar');

let productos = [];

function parseCSV(texto){
  const filas = [];
  let campo = '', fila = [], enComillas = false;
  for(let i=0;i<texto.length;i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    } else {
      if(c === '"') enComillas = true;
      else if(c === ',') { fila.push(campo); campo=''; }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila=[]; campo=''; }
      else if(c === '\r'){ /* ignorar */ }
      else campo += c;
    }
  }
  if(campo.length || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

function normalizar(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function esSi(v){
  return normalizar(v).trim() === 'si';
}

function formatearPrecio(v){
  if(v===undefined || v===null) return '';
  let limpio = v.toString().replace(/[^0-9.,]/g,'').trim();
  if(!limpio) return '';
  const num = parseInt(limpio.replace(/[.,]/g,''),10);
  if(isNaN(num) || num===0) return '';
  return '$' + num.toLocaleString('es-AR');
}

function cargar(){
  fetch(CSV_URL)
    .then(r => { if(!r.ok) throw new Error('no'); return r.text(); })
    .then(txt => {
      const filas = parseCSV(txt);
      let hIdx = filas.findIndex(f => f.some(c => normalizar(c)==='producto') && f.some(c => normalizar(c)==='precio'));
      if(hIdx === -1) hIdx = 0;
      const enc = filas[hIdx].map(c => normalizar(c).trim());
      const iCat = enc.indexOf('categoria');
      const iProd = enc.indexOf('producto');
      const iPrec = enc.indexOf('precio');
      const iST = enc.indexOf('sin tacc');
      const iVG = enc.indexOf('vegano');

      productos = [];
      for(let i=hIdx+1;i<filas.length;i++){
        const f = filas[i];
        const nombre = (f[iProd]||'').trim();
        if(!nombre) continue;
        productos.push({
          cat: iCat>-1 ? (f[iCat]||'').trim() : '',
          nombre,
          precio: iPrec>-1 ? formatearPrecio(f[iPrec]) : '',
          st: iST>-1 ? esSi(f[iST]) : false,
          vg: iVG>-1 ? esSi(f[iVG]) : false,
        });
      }
      estado.style.display='none';
      render('');
    })
    .catch(() => {
      estado.className = 'estado error';
      estado.textContent = 'No se pudo cargar la lista. Revisa la conexion.';
    });
}

function resaltar(texto, q){
  if(!q) return texto;
  const nt = normalizar(texto), nq = normalizar(q);
  const idx = nt.indexOf(nq);
  if(idx===-1) return texto;
  return texto.slice(0,idx) + '<mark>' + texto.slice(idx,idx+q.length) + '</mark>' + texto.slice(idx+q.length);
}

function render(q){
  const nq = normalizar(q).trim();
  let res = productos;
  if(nq){
    // Filtros especiales por etiqueta
    const esBusquedaST = (nq === 'sin tacc' || nq === 'sintacc' || nq === 'sin tac' || nq === 'sin gluten' || nq === 'celiaco' || nq === 'celiacos' || nq === 'celiaco/a');
    const esBusquedaVG = (nq === 'vegano' || nq === 'veganos' || nq === 'vegana' || nq === 'veganas' || nq === 'vegan');
    if(esBusquedaST){
      res = productos.filter(p => p.st);
    } else if(esBusquedaVG){
      res = productos.filter(p => p.vg);
    } else {
      res = productos.filter(p => normalizar(p.nombre).includes(nq));
    }
  }
  lista.innerHTML = '';
  if(res.length===0){
    conteo.style.display='none';
    estado.style.display='block';
    estado.className='estado';
    estado.textContent = nq ? 'No hay productos con ese nombre.' : 'Escribi para buscar.';
    return;
  }
  estado.style.display='none';
  conteo.style.display='block';
  conteo.textContent = nq
    ? res.length + (res.length===1?' resultado':' resultados')
    : res.length + ' productos - escribi para filtrar';

  const frag = document.createDocumentFragment();
  res.forEach(p => {
    const li = document.createElement('li');
    li.className='item';
    let tags='';
    if(p.st) tags += '<span class="tag st">SIN TACC</span>';
    if(p.vg) tags += '<span class="tag vg">VEGANO</span>';
    li.innerHTML =
      '<div class="info">' +
        '<div class="nombre">' + resaltar(p.nombre,q) + '</div>' +
        (p.cat?'<div class="cat">' + p.cat + '</div>':'') +
        (tags?'<div class="tags">' + tags + '</div>':'') +
      '</div>' +
      '<div class="precio ' + (p.precio?'':'sin') + '">' + (p.precio || 'a confirmar') + '</div>';
    frag.appendChild(li);
  });
  lista.appendChild(frag);
}

function actualizarChips(){
  const val = normalizar(input.value).trim();
  document.querySelectorAll('.chip').forEach(ch => {
    ch.classList.toggle('activo', normalizar(ch.dataset.filtro).trim() === val);
  });
}

input.addEventListener('input', e => {
  caja.classList.toggle('tiene-texto', e.target.value.length>0);
  actualizarChips();
  actualizarWsp();
  render(e.target.value);
});
btnLimpiar.addEventListener('click', () => {
  input.value=''; caja.classList.remove('tiene-texto');
  actualizarChips();
  render(''); input.focus();
});

document.querySelectorAll('.chip').forEach(ch => {
  ch.addEventListener('click', () => {
    const filtro = ch.dataset.filtro;
    // Si ya estaba activo, lo apaga
    if(normalizar(input.value).trim() === normalizar(filtro).trim()){
      input.value=''; caja.classList.remove('tiene-texto');
    } else {
      input.value = filtro; caja.classList.add('tiene-texto');
    }
    actualizarChips();
    render(input.value);
  });
});

const wsp = document.getElementById('wsp');
const WSP_NUMERO = '5492241491822'; // +54 9 2241 49-1822

function actualizarWsp(){
  const q = input.value.trim();
  let msg;
  if(q){
    msg = 'Hola! Estoy usando el buscador de precios y quería avisar un error con: "' + q + '" (precio desactualizado o no lo encontré). Gracias!';
  } else {
    msg = 'Hola! Estoy usando el buscador de precios y quería avisar sobre un producto (precio desactualizado o no lo encontré). Gracias!';
  }
  wsp.href = 'https://wa.me/' + WSP_NUMERO + '?text=' + encodeURIComponent(msg);
}
actualizarWsp();

cargar();
</script>
</body>
</html>
